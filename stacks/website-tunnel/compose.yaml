
services:
  web:
    image: nginx@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: static_website
    restart: unless-stopped
    volumes:
      - /home/frodo/services/website/html:/usr/share/nginx/html:ro
    networks:
      - web_net

  cloudflared:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - web_net

networks:
  web_net:
    driver: bridge