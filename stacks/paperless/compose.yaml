version: "3.4"

services:
  broker:
    image: docker.io/library/redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:15-alpine
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless_db_password_change_me

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8010:8000"
    volumes:
      - "/run/media/frodo/New Volume/paperless/data:/usr/src/paperless/data"
      - "/run/media/frodo/New Volume/paperless/media:/usr/src/paperless/media"
      - "/run/media/frodo/New Volume/paperless/consume:/usr/src/paperless/consume"
      - "/run/media/frodo/New Volume/paperless/export:/usr/src/paperless/export"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless_db_password_change_me
      PAPERLESS_TIME_ZONE: Europe/Bucharest
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_SECRET_KEY: replace_this_with_a_long_random_secret_key_123456
      PAPERLESS_URL: http://192.168.0.100:8010
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: set_your_admin_password_here
      USERMAP_UID: 1000
      USERMAP_GID: 1000

volumes:
  pgdata:
  redisdata: